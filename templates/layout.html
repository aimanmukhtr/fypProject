<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoML Comparison Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <nav>
                <a href="{{ url_for('index') }}" class="logo">AutoML Compare</a>
                <div class="nav-links">
                    <a href="{{ url_for('index') }}" class="nav-link"><i class="fas fa-home"></i> Home</a>
                    <a href="#" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Auto-dismiss flash messages after 5 seconds
        setTimeout(() => {
            const flashes = document.querySelectorAll('.flash');
            flashes.forEach(flash => {
                flash.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => flash.remove(), 300);
            });
        }, 5000);
    </script>
</body>
</html>
