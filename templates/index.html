{% extends "layout.html" %}

{% block title %}Upload Dataset{% endblock %}

{% block content %}
<div class="card fade-in">
    <h1><i class="fas fa-upload"></i> Upload Dataset</h1>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">Dataset File (CSV)</label>
            <div class="file-upload">
                <input type="file" name="file" id="file" accept=".csv" required>
                <label for="file" class="file-upload-label">
                    <i class="fas fa-cloud-upload-alt"></i> Choose a file
                </label>
                <span id="file-name">No file chosen</span>
            </div>
            <small class="info-note">Please upload a CSV file containing your dataset</small>
        </div>
        
        <button type="submit" class="button">
            <i class="fas fa-arrow-right"></i> Upload and Continue
        </button>
    </form>
</div>

<script>
    document.getElementById('file').addEventListener('change', function(e) {
        const fileName = e.target.files[0] ? e.target.files[0].name : 'No file chosen';
        document.getElementById('file-name').textContent = fileName;
    });
</script>
{% endblock %}
